<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FootMonde – Où regarder le football</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#14201a;--mut:#5f6f66;--ac:#0e9f4f;--bd:#dce4de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#18211b;--tx:#eef4ef;--mut:#93a49a;--ac:#2ed16f;--bd:#26332a}}
:root[data-theme="dark"]{--bg:#0f1511;--card:#18211b;--tx:#eef4ef;--mut:#93a49a;--ac:#2ed16f;--bd:#26332a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{padding:28px 18px 8px;max-width:960px;margin:auto}
h1{margin:0;font-size:1.8rem}h1 span{color:var(--ac)}
p.sub{color:var(--mut);margin:6px 0 14px}
main{max-width:960px;margin:auto;padding:0 18px 40px}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:99px;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06210f;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.1rem}
.card p{margin:0;color:var(--mut);font-size:.92rem;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.tag.free{color:var(--ac);border-color:var(--ac)}
a.go{display:inline-block;text-align:center;background:var(--ac);color:#06210f;text-decoration:none;padding:9px;border-radius:9px;font-weight:700}
.note{margin-top:26px;padding:14px;border:1px dashed var(--bd);border-radius:12px;color:var(--mut);font-size:.88rem}
.empty{color:var(--mut);padding:20px 0}
</style>
</head>
<body>
<header>
<h1>Foot<span>Monde</span></h1>
<p class="sub">Où regarder le football du monde entier, via les diffuseurs officiels.</p>
<input id="q" type="search" placeholder="Rechercher un championnat, un diffuseur…" aria-label="Rechercher">
<div class="chips" id="chips"></div>
</header>
<main>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Aucun résultat.</div>
<div class="note">Les droits de diffusion changent selon les pays et les saisons. Vérifie sur le site du diffuseur ce qui est disponible là où tu te trouves. Ce site ne propose aucun flux pirate.</div>
</main>
<script>
var DATA=[
{n:"FIFA+",d:"Plateforme officielle de la FIFA : matchs en direct selon les territoires, archives et documentaires.",t:["Monde"],c:"Coupes du monde, compétitions FIFA",f:1,u:"https://www.fifa.com/fifaplus"},
{n:"CAF (compétitions africaines)",d:"Site officiel de la Confédération africaine : calendriers, résumés et informations de diffusion de la CAN et des coupes CAF.",t:["Afrique"],c:"CAN, Ligue des champions CAF",f:1,u:"https://www.cafonline.com/"},
{n:"SuperSport",d:"Grand diffuseur de football en Afrique subsaharienne, avec Premier League, LaLiga et compétitions africaines.",t:["Afrique"],c:"Premier League, LaLiga, CAF",f:0,u:"https://www.supersport.com/"},
{n:"Canal+ Sport",d:"Football européen et africain avec offres adaptées à plusieurs pays francophones.",t:["Afrique","Europe"],c:"Ligue des champions, Premier League, Ligue 1",f:0,u:"https://www.canalplus.com/sport/"},
{n:"beIN SPORTS",d:"Diffuseur majeur au Moyen-Orient, en Afrique du Nord, en France et ailleurs.",t:["Afrique","Europe","Monde"],c:"Ligue 1, LaLiga, compétitions de clubs",f:0,u:"https://www.beinsports.com/"},
{n:"DAZN",d:"Streaming sportif disponible dans de nombreux pays, avec des droits variables selon la région.",t:["Europe","Monde"],c:"Serie A, LaLiga, Ligue des champions selon pays",f:0,u:"https://www.dazn.com/"},
{n:"UEFA.tv",d:"Contenus officiels de l’UEFA : résumés, replays et matchs selon les zones.",t:["Europe"],c:"Ligue des champions, Euro",f:0,u:"https://www.uefa.tv/"},
{n:"Premier League",d:"Site officiel avec calendrier, résumés et liste des diffuseurs par pays.",t:["Europe"],c:"Premier League",f:1,u:"https://www.premierleague.com/"},
{n:"LaLiga",d:"Site officiel de la liga espagnole : calendrier, résumés et diffuseurs par pays.",t:["Europe"],c:"LaLiga",f:1,u:"https://www.laliga.com/"},
{n:"Ligue 1",d:"Site officiel du championnat de France : calendrier, résumés et informations de diffusion.",t:["Europe"],c:"Ligue 1",f:1,u:"https://ligue1.com/"},
{n:"Bundesliga",d:"Site officiel allemand avec calendrier, vidéos et diffuseurs par pays.",t:["Europe"],c:"Bundesliga",f:1,u:"https://www.bundesliga.com/"},
{n:"Serie A",d:"Site officiel du championnat italien : calendrier, résumés et diffuseurs.",t:["Europe"],c:"Serie A",f:1,u:"https://www.legaseriea.it/"},
{n:"ESPN",d:"Diffuseur américain et latino-américain avec nombreux championnats et coupes.",t:["Amériques"],c:"MLS, LaLiga, Copa selon pays",f:0,u:"https://www.espn.com/watch/"},
{n:"Paramount+",d:"Streaming proposant notamment la Ligue des champions dans certains pays.",t:["Amériques","Europe"],c:"Ligue des champions selon pays",f:0,u:"https://www.paramountplus.com/"},
{n:"MLS",d:"Site officiel de la ligue nord-américaine : calendrier, résumés et accès aux matchs.",t:["Amériques"],c:"MLS",f:0,u:"https://www.mlssoccer.com/"},
{n:"SofaScore",d:"Scores en direct, statistiques et calendriers de milliers de compétitions.",t:["Scores","Monde"],c:"Toutes compétitions",f:1,u:"https://www.sofascore.com/fr/"},
{n:"Flashscore",d:"Résultats en direct, classements et compositions d’équipes dans le monde entier.",t:["Scores","Monde"],c:"Toutes compétitions",f:1,u:"https://www.flashscore.fr/"}
];
var CATS=["Tout","Gratuit","Afrique","Europe","Amériques","Monde","Scores"];
var cat="Tout",chips=document.getElementById("chips"),q=document.getElementById("q"),grid=document.getElementById("grid"),empty=document.getElementById("empty");
CATS.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===cat?" on":"");b.textContent=c;b.onclick=function(){cat=c;[].forEach.call(chips.children,function(x){x.classList.toggle("on",x.textContent===c)});render()};chips.appendChild(b)});
function render(){
 var s=q.value.trim().toLowerCase(),n=0;grid.innerHTML="";
 DATA.forEach(function(p){
  var ok=cat==="Tout"||(cat==="Gratuit"?p.f:p.t.indexOf(cat)>-1);
  if(ok&&s)ok=(p.n+" "+p.d+" "+p.c+" "+p.t.join(" ")).toLowerCase().indexOf(s)>-1;
  if(!ok)return;n++;
  var c=document.createElement("div");c.className="card";
  var h=document.createElement("h3");h.textContent=p.n;
  var d=document.createElement("p");d.textContent=p.d;
  var tg=document.createElement("div");tg.className="tags";
  var all=[p.f?"Accès libre":"Abonnement"].concat(p.t,[p.c]);
  all.forEach(function(x,i){var e=document.createElement("span");e.className="tag"+(i===0&&p.f?" free":"");e.textContent=x;tg.appendChild(e)});
  var a=document.createElement("a");a.className="go";a.href=p.u;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Ouvrir";
  c.append(h,tg,d,a);grid.appendChild(c);
 });
 empty.hidden=n>0;
}
q.oninput=render;render();
</script>
</body>
</html>
